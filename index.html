<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AshenSpire II — The Hollow March</title><link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f161c;color:#eee7d7;font:16px system-ui}
    #unity-canvas{display:block;width:100%;height:100%;outline:none}
    #loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#0f161c;gap:12px}
    progress{width:320px;accent-color:#deb870}
    #storage{position:fixed;z-index:20;top:16px;right:16px;display:flex;align-items:center;gap:14px;max-width:min(680px,calc(100vw - 32px));padding:14px 16px;border:1px solid #8c6238;border-radius:6px;background:#111a20;color:#f4d79e;box-shadow:0 8px 24px #0009;font-size:15px;line-height:1.4}
    #storage[hidden]{display:none}
    #storage-message{display:block;min-width:0}
    #retry-storage{min-height:42px;flex:none;padding:8px 16px;border:1px solid #deb870;border-radius:4px;background:#deb870;color:#111a20;font:600 15px system-ui;cursor:pointer}
    #retry-storage:hover{background:#f1cc88}
    #retry-storage:focus-visible{outline:3px solid #fff;outline-offset:2px}
    #failure{max-width:680px;white-space:pre-wrap;color:#ffb5a4}
  </style>
</head>
<body>
<canvas id="unity-canvas" tabindex="0" aria-label="AshenSpire II game"></canvas>
<div id="loading"><h1>AshenSpire II</h1><span>Opening the road…</span><progress id="progress" max="1" value="0"></progress><div id="failure"></div></div>
<div id="storage" role="status" aria-live="polite" hidden><span id="storage-message"></span><button id="retry-storage" hidden>Retry browser save</button></div>
<script src="Build/web-20261107-231851.loader.js"></script>
<script>
const canvas=document.getElementById('unity-canvas');
window.ashenWebQaBuild=false;
window.ashenStorage={state:'ready',error:''};
window.ashenSetStorage=function(state,error=''){
  window.ashenStorage={state,error};
  document.getElementById('storage').hidden=state==='ready';
  document.getElementById('storage-message').textContent=state==='syncing'?'Saving to this browser…':state==='error'?'Browser save failed — keep this tab open and retry. ':'';
  document.getElementById('retry-storage').hidden=state!=='error';
};
document.getElementById('retry-storage').onclick=()=>window.unityInstance?.SendMessage('AshenSpire','RetryBrowserStorage');
createUnityInstance(canvas,{
  dataUrl:'Build/web-20261107-231851.data',frameworkUrl:'Build/web-20261107-231851.framework.js',codeUrl:'Build/web-20261107-231851.wasm',streamingAssetsUrl:'StreamingAssets',
  companyName:'Cehinds',productName:'AshenSpire II',productVersion:'0.1.3',
  // Explicit callbacks below provide durable-write completion and visible failure handling.
  autoSyncPersistentDataPath:false,
  showBanner:(message,type)=>{if(type==='error')document.getElementById('failure').textContent=message;}
}, value=>document.getElementById('progress').value=value).then(instance=>{
  window.unityInstance=instance;
  if(window.ashenWebQaBuild)window.ashenQaCommand=command=>instance.SendMessage('AshenSpire','WebQaCommand',command);
  document.getElementById('loading').style.display='none';
  canvas.focus();
}).catch(error=>{document.getElementById('failure').textContent=String(error);window.ashenStartupError=String(error);});
window.addEventListener('beforeunload',event=>{if(window.ashenStorage.state!=='ready'){event.preventDefault();event.returnValue='';}});
</script>
</body></html>
